<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKB β</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Analyzer for Kyushu Battlefield β</h1>

    <p class="version">
        Version 0.2.0
    </p>

    <div class="card">

        <h2>📷 戦況画像</h2>

        <input
            type="file"
            id="imageInput"
            accept="image/*">

    </div>
<div class="card">

    <h2>📊 スコア画像</h2>

    <input
        type="file"
        id="scoreImageInput"
        accept="image/*">

    <img
        id="scorePreview"
        src=""
        alt="スコア画像"
        style="max-width:100%; display:none;">
<p id="timeResult">
    残り時間：未取得
</p>
</div>

    
<div class="card">

    <img
        id="preview"
        src=""
        alt="画像が表示されます"
        style="max-width:100%;">

    <h2>🛠 測量モード</h2>

    <canvas id="measureCanvas"></canvas>

    <pre id="measureInfo">
まだドラッグしていません
    </pre>

    <button id="analyzeButton">

        解析開始

    </button>
<label>経過時間（秒）</label>

<input
    type="number"
    id="elapsedTime"
    value="1200"
    min="0">
</div>

 <div class="card">

    <h2>切り抜き画像</h2>

    <div class="crop-area" id="cropArea">
        
    </div>
 </div>

    <h2>解析結果</h2>

    <pre id="result">
        まだ解析していません
    </pre>
    <h2>📊 スコア解析結果</h2>

<pre id="scoreResult">
    まだスコア解析していません
</pre>
 </div>
</div>

<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>

<script src="script.js"></script>
</body>
</html>
